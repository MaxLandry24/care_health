<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Médicaments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h1 class="mb-4">Liste des Médicaments</h1>

<a href="/medicaments/new" class="btn btn-success mb-3">Ajouter un Médicament</a>

<table class="table table-bordered">
    <thead class="table-light">
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="medicament : ${medicaments}">
        <td th:text="${medicament.id}"></td>
        <td th:text="${medicament.nom}"></td>
        <td th:text="${medicament.description}"></td>
        <td>
            <a th:href="@{/medicaments/edit/{id}(id=${medicament.id})}" class="btn btn-primary btn-sm">Éditer</a>
            <a th:href="@{/medicaments/delete/{id}(id=${medicament.id})}" class="btn btn-danger btn-sm"
               onclick="return confirm('Confirmer la suppression ?')">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
