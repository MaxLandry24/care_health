<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulaire Médicament</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 th:text="${medicament.id == null} ? 'Ajouter un Médicament' : 'Modifier le Médicament'" class="mb-4"></h2>

<form th:action="@{/medicaments/save}" th:object="${medicament}" method="post">

    <input type="text" class="form-control" th:field="*{id}" hidden required/>

    <div class="mb-3">
        <label class="form-label">Nom</label>
        <input type="text" class="form-control" th:field="*{nom}" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" th:field="*{description}" required></textarea>
    </div>

    <button type="submit" class="btn btn-success">Enregistrer</button>
    <a href="/medicaments" class="btn btn-secondary">Annuler</a>
</form>

</body>
</html>
